name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: bash -n scripts/build.sh scripts/install.sh

      - name: Run tests
        run: npx --yes bun@1.3.14 test test
