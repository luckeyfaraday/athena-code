name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            archive: tar
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar
          - target: darwin-arm64
            runner: macos-15
            archive: tar
          - target: darwin-x64
            runner: macos-15-intel
            archive: tar
          - target: windows-x64
            runner: windows-2022
            archive: zip
          - target: windows-arm64
            runner: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Build Athena Code
        run: |
          version="0.0.0-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          ATHENA_CODE_VERSION="$version" ./scripts/build.sh

      - name: Verify binary
        run: |
          binary="runtime-bin/${{ matrix.target }}/athena-code"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version

      - name: Verify Unix installer
        if: matrix.archive == 'tar'
        run: |
          install_root="$RUNNER_TEMP/athena-code-install"
          ATHENA_CODE_INSTALL_ROOT="$install_root/share" \
            ATHENA_CODE_BIN_DIR="$install_root/bin" \
            ./scripts/install.sh \
            --from-file "runtime-bin/${{ matrix.target }}/athena-code"
          "$install_root/bin/athena-code" --version

      - name: Verify Windows installer
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "athena-code-install"
          $binDir = Join-Path $installRoot "bin"
          ./scripts/install.ps1 `
            -InstallRoot $installRoot `
            -BinDir $binDir `
            -FromFile "runtime-bin/${{ matrix.target }}/athena-code.exe"
          & (Join-Path $binDir "athena-code.exe") --version

      - name: Verify Windows installer (Windows PowerShell 5.1)
        if: matrix.archive == 'zip'
        shell: powershell
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "athena-code-install-ps51"
          $binDir = Join-Path $installRoot "bin"
          ./scripts/install.ps1 `
            -InstallRoot $installRoot `
            -BinDir $binDir `
            -FromFile "runtime-bin/${{ matrix.target }}/athena-code.exe"
          & (Join-Path $binDir "athena-code.exe") --version

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        run: |
          mkdir -p dist
          stage="$(mktemp -d)"
          cp "runtime-bin/${{ matrix.target }}/athena-code" "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          asset="athena-code-${{ matrix.target }}.tar.gz"
          tar -C "$stage" -czf "dist/$asset" athena-code LICENSE THIRD_PARTY_NOTICES.md
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          fi

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item "runtime-bin/${{ matrix.target }}/athena-code.exe" stage/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md stage/
          $asset = "athena-code-${{ matrix.target }}.zip"
          Compress-Archive -Path stage/* -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "dist/$asset.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-code-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: athena-code-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Athena Code $GITHUB_REF_NAME"
